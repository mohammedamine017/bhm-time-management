services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bhm_time_management_v2
      POSTGRES_USER: bhm
      POSTGRES_PASSWORD: bhm
    ports:
      - "5434:5432"
    volumes:
      - bhm_v2_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhm -d bhm_time_management_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bhm_v2_postgres:

